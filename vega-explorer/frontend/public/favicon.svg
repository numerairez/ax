<!-- Narra: a narra tree whose branches are an investigation trail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- the narra's broad umbrella crown -->
  <path d="M1.5 15.5 C1.5 6.5 8 2.5 16 2.5 C24 2.5 30.5 6.5 30.5 15.5 C30.5 18 27 19.5 16 19.5 C5 19.5 1.5 18 1.5 15.5 Z" fill="#4f46e5" fill-opacity=".2"/>
  <!-- leads not taken -->
  <g stroke="#8f8af2" stroke-width="2.6">
    <path d="M16 21.5 L10 16 L5.5 13"/>
    <path d="M10 16 L10 8.5"/>
    <path d="M22 16 L26.5 13"/>
  </g>
  <g fill="#8f8af2">
    <circle cx="5.5" cy="13" r="2.6"/>
    <circle cx="10" cy="8.5" r="2.6"/>
    <circle cx="26.5" cy="13" r="2.6"/>
  </g>
  <!-- the story you followed, from root to blossom -->
  <path d="M16 30 L16 21.5 L22 16 L21.5 8" stroke="#4f46e5" stroke-width="3.4"/>
  <circle cx="21.5" cy="7.5" r="4" fill="#f5b301"/>
</svg>
